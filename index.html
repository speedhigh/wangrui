<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>加油王瑞</title>
    <style>
      :root {
        --primary-color: #ffb6c1; /* 柔和的粉色 */
        --secondary-color: #fff0f5; /* 淡粉色 */
        --accent-color: #ffc0cb; /* 浅粉色 */
        --text-color: #8b5a5a; /* 温暖的棕色 */
        --purple-text: #9b6b9b; /* 偏紫色 */
        --background-color: #fff5f5; /* 淡粉色背景 */
        --success-color: #98fb98; /* 柔和的绿色 */
        --warning-color: #ffb6c1; /* 柔和的红色 */
      }

      @keyframes float {
        0% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-8px) rotate(5deg);
        }
        100% {
          transform: translateY(0px) rotate(0deg);
        }
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes sparkle {
        0% {
          opacity: 0;
          transform: scale(0.5) rotate(0deg);
        }
        50% {
          opacity: 1;
          transform: scale(1) rotate(180deg);
        }
        100% {
          opacity: 0;
          transform: scale(0.5) rotate(360deg);
        }
      }

      @keyframes cloudFloat {
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
      }

      body {
        overflow: hidden;
        overscroll-behavior: none;
        background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80')
          no-repeat center center fixed;
        background-size: cover;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', sans-serif;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -webkit-text-size-adjust: 100%;
        user-select: none;
      }

      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(8px);
        z-index: -1;
      }

      #game-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(5px);
        overflow: hidden;
      }

      #character {
        position: absolute;
        width: 50px;
        height: 60px;
        bottom: calc(118px + env(safe-area-inset-bottom));
        left: 0;
        font-size: 50px;
        text-align: center;
        line-height: 60px;
        z-index: 2;
        animation: float 3s ease-in-out infinite;
        filter: drop-shadow(0 4px 8px rgba(255, 182, 193, 0.3));
      }

      .heart {
        position: absolute;
        width: 50px;
        height: 50px;
        font-size: 50px;
        text-align: center;
        line-height: 50px;
        z-index: 1;
        animation: float 2s ease-in-out infinite;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
      }

      #hud {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        left: 8px;
        right: 8px;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        pointer-events: none;
      }

      .hud-side {
        display: flex;
        align-items: center;
        gap: 6px;
        pointer-events: auto;
      }

      .level-indicator,
      #score,
      #timer {
        color: var(--purple-text);
        background: rgba(255, 255, 255, 0.72);
        border-radius: 15px;
        box-shadow: 0 2px 8px rgba(155, 107, 155, 0.1);
        backdrop-filter: blur(5px);
        border: 1px solid rgba(155, 107, 155, 0.2);
        white-space: nowrap;
      }

      .level-indicator {
        font-size: clamp(12px, 3.2vw, 15px);
        padding: 4px 8px;
        pointer-events: auto;
      }

      #score {
        font-size: clamp(13px, 3.6vw, 18px);
        padding: 6px 10px;
        font-weight: 600;
        pointer-events: auto;
      }

      #timer {
        font-size: clamp(12px, 3.2vw, 15px);
        padding: 4px 8px;
      }

      #message {
        position: fixed;
        top: calc(62px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        font-size: clamp(18px, 5vw, 24px);
        color: var(--purple-text);
        text-align: center;
        opacity: 0;
        transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 3;
        text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
        background: rgba(255, 255, 255, 0.82);
        padding: 12px 20px;
        border-radius: 20px;
        box-shadow: 0 4px 15px rgba(155, 107, 155, 0.1);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(155, 107, 155, 0.2);
        max-width: min(80%, 320px);
        word-wrap: break-word;
        pointer-events: none;
        box-sizing: border-box;
      }

      #message::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
        border-radius: 20px;
        z-index: -1;
      }

      @keyframes messageFloat {
        0% {
          transform: translateX(-50%) translateY(0);
        }
        50% {
          transform: translateX(-50%) translateY(-5px);
        }
        100% {
          transform: translateX(-50%) translateY(0);
        }
      }

      #message.show {
        animation: messageFloat 2s ease-in-out infinite;
      }

      #start-screen {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(255, 255, 255, 0.94);
        z-index: 4;
        backdrop-filter: blur(10px);
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
        box-sizing: border-box;
      }

      #start-screen h1 {
        font-size: clamp(36px, 10vw, 48px);
        color: var(--purple-text);
        margin: 0 0 24px;
        text-align: center;
        animation: fadeIn 0.8s ease-out;
        text-shadow: 2px 2px 4px rgba(255, 182, 193, 0.2);
      }

      #start-screen .start-lead {
        font-size: clamp(18px, 5vw, 22px);
        color: var(--purple-text);
        margin: 0 0 10px;
        max-width: 100%;
        min-width: 0;
        text-align: center;
        animation: fadeIn 1s ease-out;
        line-height: 1.5;
      }

      #start-screen .start-hint {
        font-size: 15px;
        color: var(--purple-text);
        margin: 0 0 36px;
        max-width: 100%;
        min-width: 0;
        text-align: center;
        opacity: 0.8;
        animation: fadeIn 1.1s ease-out;
        line-height: 1.6;
      }

      #start-button {
        padding: 15px 40px;
        font-size: 24px;
        background: var(--primary-color);
        color: white;
        border: none;
        border-radius: 40px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 15px rgba(255, 182, 193, 0.3);
        animation: pulse 2s infinite;
      }

      #start-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 182, 193, 0.4);
      }

      #controls {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 16px max(24px, 8vw) calc(18px + env(safe-area-inset-bottom));
        box-sizing: border-box;
        z-index: 3;
        pointer-events: none;
      }

      .control-button {
        width: 84px;
        height: 84px;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 42px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: var(--purple-text);
        font-size: 36px;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        box-shadow: 0 4px 15px rgba(255, 182, 193, 0.2);
        backdrop-filter: blur(5px);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        border: 2px solid rgba(155, 107, 155, 0.3);
        pointer-events: auto;
        touch-action: none;
      }

      .control-button:active {
        transform: scale(0.95);
        box-shadow: 0 2px 8px rgba(255, 182, 193, 0.2);
      }

      #music-control {
        width: 40px;
        height: 40px;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: var(--purple-text);
        font-size: 18px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(255, 182, 193, 0.2);
        backdrop-filter: blur(5px);
        transition: transform 0.15s ease;
        border: 2px solid rgba(155, 107, 155, 0.3);
        flex-shrink: 0;
        touch-action: manipulation;
      }

      #music-control:active {
        transform: scale(0.95);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      /* 添加一些装饰元素 */
      .decoration {
        position: absolute;
        width: 100px;
        height: 100px;
        background: rgba(255, 107, 107, 0.1);
        border-radius: 50%;
        z-index: 0;
      }

      .decoration:nth-child(1) {
        top: 20px;
        left: 20px;
        animation: pulse 4s infinite;
      }

      .decoration:nth-child(2) {
        bottom: 20px;
        right: 20px;
        animation: pulse 4s infinite 2s;
      }

      .falling-object {
        position: absolute;
        width: 40px;
        height: 40px;
        z-index: 1;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 4px 8px rgba(255, 182, 193, 0.25);
        will-change: top;
      }

      .falling-object.star {
        background: rgba(255, 248, 220, 0.92);
        border-color: rgba(240, 180, 41, 0.85);
      }

      .falling-object.star::after {
        content: '★';
        font-size: 24px;
        color: #e0a106;
        text-shadow: 0 0 8px rgba(255, 214, 102, 0.8);
      }

      .falling-object.heart {
        background: rgba(255, 228, 236, 0.94);
        border-color: rgba(255, 105, 180, 0.75);
      }

      .falling-object.heart::after {
        content: '❤';
        font-size: 24px;
        color: #ff4f93;
        text-shadow: 0 0 8px rgba(255, 105, 180, 0.45);
      }

      .falling-object.bomb {
        background: rgba(255, 236, 236, 0.94);
        border-color: rgba(230, 70, 70, 0.8);
      }

      .falling-object.bomb::after {
        content: '💣';
        font-size: 22px;
      }

      .heart {
        color: #ffb6c1;
      }
      .star {
        color: #ffd700;
      }
      .gift {
        color: #98fb98;
      }
      .bomb {
        color: #ffb6c1;
      }

      @keyframes shake {
        0% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-5px);
        }
        50% {
          transform: translateX(5px);
        }
        75% {
          transform: translateX(-5px);
        }
        100% {
          transform: translateX(0);
        }
      }

      #character.shake {
        animation: shake 0.5s ease-in-out;
      }

      .sparkle {
        position: absolute;
        width: 15px;
        height: 15px;
        background: rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        animation: sparkle 1.5s infinite;
        pointer-events: none;
        z-index: 0;
      }

      #level-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(255, 255, 255, 0.8);
        z-index: 5;
        backdrop-filter: blur(10px);
      }

      #level-screen h2 {
        font-size: 36px;
        color: var(--purple-text);
        margin-bottom: 20px;
        text-align: center;
        animation: fadeIn 0.8s ease-out;
        text-shadow: 2px 2px 4px rgba(255, 182, 193, 0.2);
      }

      #level-screen p {
        font-size: 24px;
        color: var(--purple-text);
        margin-bottom: 30px;
        text-align: center;
        animation: fadeIn 1s ease-out;
        max-width: 80%;
        line-height: 1.5;
      }

      #level-screen .objective {
        font-size: 28px;
        color: var(--primary-color);
        margin-bottom: 40px;
        text-align: center;
        animation: fadeIn 1.2s ease-out;
        font-weight: bold;
      }

      #level-screen button {
        padding: 15px 40px;
        font-size: 24px;
        background: var(--primary-color);
        color: white;
        border: none;
        border-radius: 40px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 15px rgba(255, 182, 193, 0.3);
        animation: pulse 2s infinite;
      }

      #victory-screen {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: radial-gradient(
          circle at 50% 42%,
          rgba(255, 228, 236, 0.96),
          rgba(255, 248, 250, 0.94) 42%,
          rgba(255, 255, 255, 0.96)
        );
        z-index: 6;
        backdrop-filter: blur(12px);
        overflow: hidden;
      }

      #victory-screen.is-active {
        animation: veilIn 0.9s ease;
      }

      @keyframes veilIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .victory-glow {
        position: absolute;
        width: min(78vw, 320px);
        height: min(78vw, 320px);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 182, 193, 0.38), rgba(255, 182, 193, 0) 68%);
        animation: breathe 3.8s ease-in-out infinite;
        pointer-events: none;
      }

      @keyframes breathe {
        0%,
        100% {
          transform: scale(0.92);
          opacity: 0.55;
        }
        50% {
          transform: scale(1.08);
          opacity: 0.95;
        }
      }

      #victory-lines {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 280px;
        margin-bottom: 72px;
        padding: 0 28px;
        box-sizing: border-box;
      }

      .victory-line {
        margin: 8px 0;
        font-size: clamp(26px, 7.2vw, 36px);
        line-height: 1.45;
        color: var(--purple-text);
        letter-spacing: 0.06em;
        text-align: center;
        opacity: 0;
        filter: blur(8px);
        transform: translateY(16px);
      }

      .victory-line.is-visible {
        animation: lineReveal 1.2s ease forwards;
      }

      .victory-line.is-last.is-visible {
        color: #e07a9a;
        animation: lineReveal 1.2s ease forwards, softGlow 2.8s ease-in-out 1.2s infinite;
      }

      @keyframes lineReveal {
        0% {
          opacity: 0;
          transform: translateY(16px);
          filter: blur(8px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }

      @keyframes softGlow {
        0%,
        100% {
          text-shadow: 0 0 0 rgba(255, 143, 171, 0);
          transform: translateY(0);
        }
        50% {
          text-shadow: 0 0 18px rgba(255, 143, 171, 0.7);
          transform: translateY(-3px);
        }
      }

      #victory-retry-button {
        position: absolute;
        z-index: 1;
        left: 50%;
        bottom: calc(36px + env(safe-area-inset-bottom));
        transform: translateX(-50%) translateY(10px);
        padding: 14px 36px;
        font-size: 20px;
        background: var(--primary-color);
        color: white;
        border: none;
        border-radius: 40px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(255, 182, 193, 0.35);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.8s ease, transform 0.8s ease;
      }

      #victory-retry-button.is-visible {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0);
      }

      .soft-heart {
        position: absolute;
        bottom: 6%;
        z-index: 0;
        opacity: 0;
        pointer-events: none;
        animation: heartRise 5s ease-in forwards;
      }

      @keyframes heartRise {
        0% {
          opacity: 0;
          transform: translateY(0) scale(0.7);
        }
        16% {
          opacity: 0.85;
        }
        100% {
          opacity: 0;
          transform: translateY(-78vh) scale(1.15);
        }
      }

      #failure-screen {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(255, 255, 255, 0.9);
        z-index: 6;
        backdrop-filter: blur(10px);
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
        box-sizing: border-box;
      }

      #failure-screen h1 {
        font-size: 36px;
        color: var(--purple-text);
        margin-bottom: 20px;
        text-align: center;
        animation: fadeIn 0.8s ease-out;
      }

      #failure-screen p {
        font-size: 24px;
        color: var(--purple-text);
        margin-bottom: 30px;
        text-align: center;
        animation: fadeIn 1s ease-out;
        max-width: 80%;
        line-height: 1.5;
      }

      #failure-screen button {
        padding: 15px 40px;
        font-size: 24px;
        background: var(--primary-color);
        color: white;
        border: none;
        border-radius: 40px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 15px rgba(255, 182, 193, 0.3);
        animation: pulse 2s infinite;
      }

      #failure-screen button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 182, 193, 0.4);
      }
    </style>
  </head>
  <body>
      <div id="game-container">
      <div id="hud">
        <div class="level-indicator">最高分: <span id="best-score">0</span></div>
        <div id="score">分数: 0</div>
        <div class="hud-side">
          <div id="timer">时间: 0:00</div>
          <div id="music-control" role="button" aria-label="音乐">🔇</div>
        </div>
      </div>
      <div id="start-screen">
        <h1>加油王瑞！</h1>
        <p class="start-lead">让我们一起开始这段奇妙的旅程吧！</p>
        <p class="start-hint">左右移动，接住星星和爱心，躲开炸弹</p>
        <button id="start-button">开始游戏</button>
      </div>
      <div id="victory-screen">
        <div class="victory-glow"></div>
        <div id="victory-lines"></div>
        <button id="victory-retry-button" type="button" disabled>重新挑战</button>
      </div>
      <div id="failure-screen">
        <h1>继续加油！</h1>
        <p id="failure-message"></p>
        <button id="failure-retry-button" type="button">重新挑战</button>
      </div>
      <div id="character">👩🏻‍⚕️</div>
      <div id="message"></div>
      <div id="controls">
        <div class="control-button" id="left-button">←</div>
        <div class="control-button" id="right-button">→</div>
      </div>
    </div>

    <audio id="bgm" loop>
      <source
        src="https://music.163.com/song/media/outer/url?id=1306248414.mp3"
        type="audio/mpeg"
      />
    </audio>
    <audio id="collect-sound">
      <source
        src="https://assets.mixkit.co/active_storage/sfx/2570/2570-preview.mp3"
        type="audio/mpeg"
      />
    </audio>
    <audio id="bomb-sound">
      <source
        src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"
        type="audio/mpeg"
      />
    </audio>

    <script>
      const gameContainer = document.getElementById('game-container')
      const character = document.getElementById('character')
      const scoreElement = document.getElementById('score')
      const timerElement = document.getElementById('timer')
      const messageElement = document.getElementById('message')
      const startScreen = document.getElementById('start-screen')
      const startButton = document.getElementById('start-button')
      const leftButton = document.getElementById('left-button')
      const rightButton = document.getElementById('right-button')
      const musicControl = document.getElementById('music-control')
      const bgm = document.getElementById('bgm')
      const collectSound = document.getElementById('collect-sound')
      const bombSound = document.getElementById('bomb-sound')

      const messages = [
        '一起追逐梦想！',
        '今天也要元气满满！',
        '要一直保持可爱！',
        '你的笑容最治愈！',
        '一起去看星星吧！',
        '遇见你真好！',
        '爱你哦！',
        '你的努力会有回报！',
        '一起追逐梦想！',
        '一起去看星星吧！',
      ]

      const victoryLines = [
        '恭喜你通关了',
        '亲爱的王瑞，',
        '我想对你说，',
        '我好想你，',
        '要永远快乐开心，',
        '嘻嘻爱你哦😘',
      ]

      const fallingObjects = [
        { type: 'star', points: 5, sound: collectSound, probability: 0.5 },
        { type: 'heart', points: 20, sound: collectSound, probability: 0.25 },
        { type: 'bomb', sound: bombSound, probability: 0.25 },
      ]

      const characterSpeed = 280
      const characterWidth = 50
      const characterHeight = 60
      const objectSize = 40
      let score = 0
      let timeLeft = 0
      let moveRaf = 0
      let lastMoveTs = 0
      let timeAccumulator = 0
      let spawnAccumulator = 0
      let characterPosition = 0
      let characterTop = 0
      let containerWidth = 0
      let playfieldHeight = 0
      let isMovingLeft = false
      let isMovingRight = false
      let isMusicPlaying = false
      let gameActive = false
      let bestScore = Number(localStorage.getItem('bestScore')) || 0
      let messageTimer = null
      let victoryTimers = []
      const activeObjects = []

      function setMusicPlaying(playing) {
        isMusicPlaying = playing
        musicControl.textContent = playing ? '🎵' : '🔇'
      }

      function playBgm() {
        return bgm.play().then(() => {
          if (!bgm.paused) setMusicPlaying(true)
        })
      }

      musicControl.addEventListener('click', () => {
        if (isMusicPlaying) {
          bgm.pause()
          setMusicPlaying(false)
          return
        }
        playBgm().catch((error) => {
          console.log('音乐播放失败:', error)
          setMusicPlaying(false)
        })
      })

      function measurePlayfield() {
        containerWidth = gameContainer.clientWidth
        playfieldHeight = gameContainer.clientHeight
        characterTop = character.offsetTop
      }

      function characterMaxX() {
        return Math.max(0, containerWidth - characterWidth)
      }

      function centerCharacter() {
        characterPosition = characterMaxX() / 2
        character.style.left = characterPosition + 'px'
      }

      function updateCharacterPosition(dt) {
        let next = characterPosition
        const max = characterMaxX()
        if (isMovingLeft) next -= characterSpeed * dt
        if (isMovingRight) next += characterSpeed * dt
        next = Math.min(max, Math.max(0, next))
        if (next === characterPosition) return
        characterPosition = next
        character.style.left = next + 'px'
      }

      function updateClock(dt) {
        timeAccumulator += dt
        while (timeAccumulator >= 1) {
          timeAccumulator -= 1
          timeLeft += 1
          const minutes = Math.floor(timeLeft / 60)
          const seconds = timeLeft % 60
          timerElement.textContent = `时间: ${minutes}:${seconds.toString().padStart(2, '0')}`
          if (timeLeft >= 320) {
            endGame(true)
            return
          }
        }

        spawnAccumulator += dt
        while (spawnAccumulator >= 1.5) {
          spawnAccumulator -= 1.5
          createFallingObject()
        }
      }

      function updateFallingObjects(dt) {
        const charLeft = characterPosition
        const charRight = characterPosition + characterWidth
        const charTop = characterTop
        const charBottom = characterTop + characterHeight

        for (let i = activeObjects.length - 1; i >= 0; i -= 1) {
          const obj = activeObjects[i]
          obj.y += obj.speed * dt
          obj.node.style.top = obj.y + 'px'

          const hit =
            obj.y + objectSize >= charTop &&
            obj.y <= charBottom &&
            obj.x + objectSize >= charLeft &&
            obj.x <= charRight

          if (hit) {
            collectObject(i)
            if (!gameActive) return
            continue
          }

          if (obj.y > playfieldHeight) {
            obj.node.remove()
            activeObjects.splice(i, 1)
          }
        }
      }

      function movementLoop(ts) {
        if (!gameActive) return
        if (!lastMoveTs) lastMoveTs = ts
        const dt = Math.min(0.05, (ts - lastMoveTs) / 1000)
        lastMoveTs = ts
        updateCharacterPosition(dt)
        updateFallingObjects(dt)
        if (!gameActive) return
        updateClock(dt)
        if (!gameActive) return
        moveRaf = requestAnimationFrame(movementLoop)
      }

      function bindHold(button, onChange) {
        button.addEventListener('pointerdown', (event) => {
          event.preventDefault()
          try {
            button.setPointerCapture(event.pointerId)
          } catch (error) {
            // 指针已被系统取消时忽略，松手事件仍会停住移动
          }
          onChange(true)
        })
        const stop = (event) => {
          event.preventDefault()
          onChange(false)
        }
        button.addEventListener('pointerup', stop)
        button.addEventListener('pointercancel', stop)
      }

      bindHold(leftButton, (moving) => {
        isMovingLeft = moving
      })
      bindHold(rightButton, (moving) => {
        isMovingRight = moving
      })

      function showMessage() {
        const randomMessage = messages[Math.floor(Math.random() * messages.length)]
        messageElement.textContent = randomMessage
        messageElement.style.opacity = 1
        messageElement.classList.add('show')
        clearTimeout(messageTimer)
        messageTimer = setTimeout(() => {
          messageElement.style.opacity = 0
          messageElement.classList.remove('show')
        }, 2000)
      }

      function stopLoops() {
        cancelAnimationFrame(moveRaf)
        moveRaf = 0
        activeObjects.forEach((obj) => obj.node.remove())
        activeObjects.length = 0
      }

      function clearVictorySequence() {
        victoryTimers.forEach((timer) => clearTimeout(timer))
        victoryTimers = []
        document.getElementById('victory-lines').innerHTML = ''
        document.querySelectorAll('.soft-heart').forEach((node) => node.remove())
        const retryButton = document.getElementById('victory-retry-button')
        retryButton.classList.remove('is-visible')
        retryButton.disabled = true
        document.getElementById('victory-screen').classList.remove('is-active')
      }

      function startGame() {
        if (gameActive) return
        clearVictorySequence()
        stopLoops()
        startScreen.style.display = 'none'
        document.getElementById('failure-screen').style.display = 'none'
        document.getElementById('victory-screen').style.display = 'none'

        score = 0
        timeLeft = 0
        isMovingLeft = false
        isMovingRight = false
        updateScoreDisplay()
        timerElement.textContent = '时间: 0:00'
        messageElement.style.opacity = 0
        messageElement.classList.remove('show')
        measurePlayfield()
        centerCharacter()
        gameActive = true
        timeAccumulator = 0
        spawnAccumulator = 0

        if (!isMusicPlaying) {
          playBgm().catch((error) => {
            console.log('音乐播放失败:', error)
          })
        }

        createFallingObject()
        lastMoveTs = 0
        moveRaf = requestAnimationFrame(movementLoop)
      }

      function endGame(isSpecialEnding = false, isBomb = false) {
        if (!gameActive) return
        gameActive = false
        isMovingLeft = false
        isMovingRight = false
        stopLoops()

        const isNewRecord = score > bestScore
        if (isNewRecord) {
          bestScore = score
          localStorage.setItem('bestScore', String(bestScore))
          updateBestScoreDisplay()
        }

        if (isSpecialEnding) showVictoryScreen()
        else showFailureScreen(isBomb, isNewRecord)
      }

      function spawnSoftHearts(count) {
        const screen = document.getElementById('victory-screen')
        const symbols = ['💗', '✨', '🌸', '💌']
        for (let i = 0; i < count; i += 1) {
          const heart = document.createElement('div')
          heart.className = 'soft-heart'
          heart.textContent = symbols[i % symbols.length]
          heart.style.left = `${10 + Math.random() * 80}%`
          heart.style.fontSize = `${16 + Math.random() * 14}px`
          heart.style.animationDuration = `${4.2 + Math.random() * 2}s`
          screen.appendChild(heart)
          victoryTimers.push(setTimeout(() => heart.remove(), 6500))
        }
      }

      function showVictoryScreen() {
        clearVictorySequence()
        const screen = document.getElementById('victory-screen')
        const lines = document.getElementById('victory-lines')
        const retryButton = document.getElementById('victory-retry-button')
        screen.style.display = 'flex'
        screen.classList.add('is-active')

        const lineNodes = victoryLines.map((text, index) => {
          const line = document.createElement('p')
          line.className = 'victory-line'
          if (index === victoryLines.length - 1) line.classList.add('is-last')
          line.textContent = text
          lines.appendChild(line)
          return line
        })

        lineNodes.forEach((line, index) => {
          victoryTimers.push(
            setTimeout(() => {
              line.classList.add('is-visible')
              spawnSoftHearts(index === lineNodes.length - 1 ? 8 : 4)
              if (index === lineNodes.length - 1) {
                victoryTimers.push(
                  setTimeout(() => {
                    retryButton.disabled = false
                    retryButton.classList.add('is-visible')
                  }, 1000),
                )
              }
            }, 700 + index * 1500),
          )
        })
      }

      function showFailureScreen(isBomb, isNewRecord) {
        const title = document.getElementById('failure-screen').querySelector('h1')
        const message = document.getElementById('failure-message')
        if (isBomb) {
          title.textContent = '游戏结束'
          message.textContent = isNewRecord
            ? `碰到了炸弹！不过你创造了新纪录${score}分！继续加油！`
            : `碰到了炸弹！你获得了${score}分，继续加油！`
        } else {
          title.textContent = '继续加油！'
          message.textContent = isNewRecord
            ? `你创造了新纪录${score}分！继续加油！`
            : `你获得了${score}分！最高纪录是${bestScore}分，继续加油！`
        }
        document.getElementById('failure-screen').style.display = 'flex'
      }

      function retryGame() {
        startGame()
      }

      startButton.addEventListener('click', startGame)
      document.getElementById('victory-retry-button').addEventListener('click', retryGame)
      document.getElementById('failure-retry-button').addEventListener('click', retryGame)

      function updateScoreDisplay() {
        scoreElement.textContent = `分数: ${score}`
        if (gameActive && score >= 520) endGame(true)
      }

      function updateBestScoreDisplay() {
        document.getElementById('best-score').textContent = bestScore
      }

      updateBestScoreDisplay()
      measurePlayfield()
      centerCharacter()

      function createSparkle() {
        if (document.getElementById('victory-screen').style.display === 'flex') return
        const sparkle = document.createElement('div')
        sparkle.className = 'sparkle'
        sparkle.style.left = Math.random() * window.innerWidth + 'px'
        sparkle.style.top = Math.random() * window.innerHeight + 'px'
        gameContainer.appendChild(sparkle)
        setTimeout(() => sparkle.remove(), 1500)
      }

      setInterval(createSparkle, 900)

      window.addEventListener('resize', () => {
        measurePlayfield()
        if (!gameActive) centerCharacter()
        else {
          characterPosition = Math.min(characterMaxX(), Math.max(0, characterPosition))
          character.style.left = characterPosition + 'px'
        }
      })

      function collectObject(index) {
        const obj = activeObjects[index]
        obj.node.remove()
        activeObjects.splice(index, 1)

        obj.sound.currentTime = 0
        obj.sound.play().catch((error) => console.log('音效播放失败:', error))

        if (obj.type === 'bomb') {
          character.classList.add('shake')
          setTimeout(() => character.classList.remove('shake'), 500)
          endGame(false, true)
          return
        }

        score += obj.points
        updateScoreDisplay()
        if (gameActive && obj.type === 'heart') showMessage()
      }

      function createFallingObject() {
        if (!gameActive) return

        const random = Math.random()
        let selectedObject
        let cumulativeProbability = 0

        for (const object of fallingObjects) {
          cumulativeProbability += object.probability
          if (random <= cumulativeProbability) {
            selectedObject = object
            break
          }
        }
        if (!selectedObject) return

        const node = document.createElement('div')
        node.className = `falling-object ${selectedObject.type}`
        const x = Math.random() * Math.max(0, containerWidth - objectSize)
        node.style.left = x + 'px'
        node.style.top = '-40px'
        gameContainer.appendChild(node)

        activeObjects.push({
          node,
          x,
          y: -40,
          speed: (3 + Math.floor(timeLeft / 30) * 0.2) * 20,
          type: selectedObject.type,
          points: selectedObject.points || 0,
          sound: selectedObject.sound,
        })
      }
    </script>
  </body>
</html>
